name: Security regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/index.js
      - run: node --check server/scraper.js
      - run: node --check server/integrations.js
      - run: node --check vite.config.js
      - run: node --test tests/security.test.mjs
